<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocoanimales - Haz tu pedido</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#fff8f2;color:#3b2118}
header{background:#5b2d1f;color:white;text-align:center;padding:28px 16px}
header h1{margin:0 0 8px;font-size:34px} header p{margin:0}
main{max-width:650px;margin:25px auto;padding:0 18px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 6px 20px #00000012;margin-bottom:18px}
label{font-weight:bold;display:block;margin:15px 0 8px}
select,input{width:100%;padding:13px;border:1px solid #d8c2b8;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#25D366;color:white;font-weight:bold;font-size:17px;cursor:pointer;margin-top:20px}
button:hover{filter:brightness(.95)}
.result{background:#fff1e8;border-radius:12px;padding:15px;margin-top:18px;line-height:1.6}
small{color:#72594f}
</style>
</head>
<body>
<header>
  <h1>🐾 Chocoanimales</h1>
  <p>Elige tu sabor y dinos dónde encontrarte.</p>
</header>
<main>
  <div class="card">
    <h2>Haz tu pedido</h2>

    <label for="sabor">Sabor</label>
    <select id="sabor">
      <option>Maní</option>
      <option>Pasas</option>
      <option>Chinchín</option>
    </select>

    <label for="cantidad">Cantidad</label>
    <input id="cantidad" type="number" min="1" value="1">

    <label for="pabellon">Pabellón</label>
    <select id="pabellon">
      <option>Pabellón A</option>
      <option>Pabellón B</option>
      <option>Pabellón C</option>
    </select>

    <label for="salon">Salón</label>
    <input id="salon" type="text" placeholder="Ej.: 3.º A">

    <div class="result">
      <strong>Resumen:</strong>
      <div id="resumen">1 chocoanimal de Maní — Pabellón A — Salón: sin indicar</div>
    </div>

    <button onclick="enviarWhatsApp()">📲 Enviar pedido por WhatsApp</button>
    <small>El botón abrirá WhatsApp con tu pedido listo para enviar.</small>
  </div>
</main>

<script>
const sabor=document.getElementById('sabor');
const cantidad=document.getElementById('cantidad');
const pabellon=document.getElementById('pabellon');
const salon=document.getElementById('salon');
const resumen=document.getElementById('resumen');

function actualizar(){
  const c=Math.max(1, parseInt(cantidad.value)||1);
  cantidad.value=c;
  resumen.textContent=`${c} chocoanimal${c===1?'':'s'} de ${sabor.value} — ${pabellon.value} — Salón: ${salon.value.trim()||'sin indicar'}`;
}
[sabor,cantidad,pabellon,salon].forEach(e=>e.addEventListener('input',actualizar));

function enviarWhatsApp(){
  const c=Math.max(1, parseInt(cantidad.value)||1);
  const s=salon.value.trim()||'No indicado';
  const mensaje=`🐾 NUEVO PEDIDO DE CHOCOANIMALES%0A%0ASabor: ${encodeURIComponent(sabor.value)}%0ACantidad: ${c}%0APabellón: ${encodeURIComponent(pabellon.value)}%0ASalón: ${encodeURIComponent(s)}%0A%0A¡Gracias!`;
  window.open(`https://wa.me/51924582602?text=${mensaje}`,'_blank');
}
</script>
</body>
</html>
